<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071d2c" />
    <meta
      name="description"
      content="The private fantasy football league companion for Harambe's Dozen."
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('hd12-theme');
          const theme = saved === 'day' || saved === 'night'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'day';
        }
      })();
    </script>
    <title>Harambe's Dozen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
